name: xlmem
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11.8
  - pip=24.0
  - pytorch=2.2.1
  - pytorch-cuda=12.1
  - pandas=2.2.1
  - matplotlib=3.8.3
  - pyyaml=6.0.1
  - requests=2.31.0
  - pip:
      - pydantic>=2.7.3,<3.0.0
      - pydantic-core>=2.18.4,<3.0.0
      - transformers==4.38.2
      - sentence-transformers==2.5.1
      - chromadb==0.4.24
      - mem0ai==0.1.26
      # A-MEM (agiresearch/A-mem @ ceffb86, installed separately:
      #   pip install --no-deps -e ~/Sree_thanu/vendor/A-mem). Its runtime deps
      # below were verified on 2026-10-18 to install with every other pin here
      # unchanged; see envs/xlmem-amem.requirements.txt for the rebuild steps.
      - rank_bm25==0.2.2
      - nltk==3.10.3
      - litellm==1.80.0
      - pytest==8.0.2
      - pytest-cov==4.1.0
      - ruff==0.3.0
      - mypy==1.8.0
      - types-PyYAML==6.0.12.12
      - types-requests==2.31.0.6
