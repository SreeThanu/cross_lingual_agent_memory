      en: "{Poss} name is {v}."
      hi: "{poss} नाम {v} है।"
      hi-en: "{Poss} naam {v} hai."
    probe:
      en: "What is {poss} name?"
      hi: "{poss} नाम क्या है?"
      hi-en: "{Poss} naam kya hai?"
    correction:
      en: "A correction: {poss} name is not {old}, it is {new}."
      hi: "एक सुधार है: {poss} नाम {old} नहीं, बल्कि {new} है।"
      hi-en: "Ek correction hai: {poss} naam {old} nahi, {new} hai."
    reprobe:
      en: "So what is {poss} name?"
      hi: "तो {poss} नाम क्या है?"
