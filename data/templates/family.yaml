# Domain template: Family & Relationships (BENCHMARK_SPEC.md Section 3, item 5).
# Format and placeholders: see data/templates/dining.yaml.
#
# Uses the Indic kinship entities (मामा, बुआ, नानी, दादा) from entities.yaml:
# English renders them with the unambiguous descriptive term, Hinglish keeps the
# Hindi noun. That asymmetry is the point of this domain (BENCHMARK_SPEC.md §3).
#
# Consistency: the user's own pet (f_005) and the mother's occupation (f_015)
# exist in data/facts_v1.yaml and are not restated. The son and daughter are
# children (ages below), and every other domain respects that.
#
# NEEDS BILINGUAL REVIEW (BENCHMARK_SPEC.md Section 7.4).
domain: family

relations:
  person_name:
    gender: {hi: m, hi-en: m}
