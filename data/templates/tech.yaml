# Consistency with data/facts_v1.yaml: the user's OS (Linux, f_008) and phone
# (Google Pixel, f_017) exist, so the user has no phone fact here, and no value
# contains "linux", "pixel" or "google" alone. Brands that are also common
# English words (Noise, boAt) are avoided: as strict-match targets they would
# fire on unrelated memories.
