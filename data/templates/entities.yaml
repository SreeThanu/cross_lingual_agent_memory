# Entity lexicon for template-rendered facts (BENCHMARK_SPEC.md Section 2).
#
# Templates use possessive constructions only ("<possessor> <attribute> <value> है"),
# so Hindi agreement depends on the attribute noun's gender, never on the
# speaker's or the entity's gender. The possessor is rendered as
#   hi:    poss_hi_stem    + {m: "ा", f: "ी", p: "े"}   e.g. "मेर"+"ा" = "मेरा", "मेरी माँ क"+"ी" = "मेरी माँ की"
#   hi-en: poss_hien_stem  + {m: "a", f: "i", p: "e"}   e.g. "Mer"+"a" = "Mera", "Meri mother k"+"i" = "Meri mother ki"
# (p = plural / honorific / oblique head noun: "मेरे घर का", "मेरे मैनेजर ... हैं")
#   en:    poss_en                                e.g. "my", "my mother's"
# Hinglish kinship nouns follow the existing fact bank (English nouns in a Hindi frame).
#
# NEEDS BILINGUAL REVIEW (BENCHMARK_SPEC.md Section 7.4).
entities:
  user:
    poss_en: "my"
    poss_hi_stem: "मेर"
    poss_hien_stem: "mer"
  user_mother:
    poss_en: "my mother's"
    poss_hi_stem: "मेरी माँ क"
    poss_hien_stem: "meri mother k"
  user_father:
    poss_en: "my father's"
    poss_hi_stem: "मेरे पिताजी क"
    poss_hien_stem: "mere father k"
  user_sister:
    poss_en: "my sister's"
    poss_hi_stem: "मेरी बहन क"
    poss_hien_stem: "meri sister k"
  user_brother:
    poss_en: "my brother's"
    poss_hi_stem: "मेरे भाई क"
    poss_hien_stem: "mere brother k"
  user_wife:
    poss_en: "my wife's"
    poss_hi_stem: "मेरी पत्नी क"
    poss_hien_stem: "meri wife k"
  user_son:
    poss_en: "my son's"
    poss_hi_stem: "मेरे बेटे क"
    poss_hien_stem: "mere son k"
  user_daughter:
    poss_en: "my daughter's"
    poss_hi_stem: "मेरी बेटी क"
    poss_hien_stem: "meri daughter k"
  user_friend:
    poss_en: "my friend's"
    poss_hi_stem: "मेरे दोस्त क"
    poss_hien_stem: "mere friend k"
  # Kinship terms with no single English equivalent (BENCHMARK_SPEC.md Section 3,
  # Family). English uses the unambiguous descriptive term; Hinglish keeps the
  # Hindi kinship noun, as speakers do.
  user_mama:
    poss_en: "my maternal uncle's"
    poss_hi_stem: "मेरे मामा क"
    poss_hien_stem: "mere mama k"
  user_bua:
    poss_en: "my paternal aunt's"
    poss_hi_stem: "मेरी बुआ क"
    poss_hien_stem: "meri bua k"
  user_nani:
    poss_en: "my maternal grandmother's"
    poss_hi_stem: "मेरी नानी क"
    poss_hien_stem: "meri nani k"
  user_dada:
    poss_en: "my paternal grandfather's"
    poss_hi_stem: "मेरे दादा क"
    poss_hien_stem: "mere dada k"
