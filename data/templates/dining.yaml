# The fact plan. Every (entity, relation) pair is unique. A distractor is an
# entity-shift of its base fact (same relation + value, an entity with no base
# fact for that relation). Value-shift distractors are not used here: every
# relation is single-valued, so a second value for the same entity would be a
# contradiction, not a near miss.
