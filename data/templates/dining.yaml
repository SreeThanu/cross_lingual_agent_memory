# Domain template: Food & Dining (BENCHMARK_SPEC.md Section 3, item 2).
#
# Rendered by `python -m xlmem.scripts.render_facts` into data/candidates/. Rendering
# is deterministic string substitution: no model calls.
#
# Placeholders: {poss} / {Poss} = entity possessive (lower / sentence-initial),
# agreeing with the relation's head-noun gender per language; {v} = value;
# {old} / {new} = superseded / corrected value.
#
# `gender` is per language because borrowed English nouns can take a different
# gender in Hinglish than the Hindi noun does (पकवान is m, "dish" is f).
#
# English value forms are Indian English where that is what speakers use
# (brinjal, not eggplant).
#
# NEEDS BILINGUAL REVIEW (BENCHMARK_SPEC.md Section 7.4): each relation's
# templates and the value lexicon.
domain: dining

