# Domain template: Financial & Administrative (BENCHMARK_SPEC.md Section 3, item 6).
# Format and placeholders: see data/templates/dining.yaml.
#
# Tests whether quantities and dates survive translation (BENCHMARK_SPEC.md §3).
# Numeric values always carry their unit ("5 तारीख", "1800 रुपये"), so a bare
# number never becomes a match target that an age or a time could also satisfy.
#
# Consistency with data/facts_v1.yaml: the user's bank (HDFC, f_007) and credit
# card network (Visa, f_016) exist. No value here contains "hdfc" or "visa".
# The son and daughter are children and have no finance facts. Rent is only for
# people without a home loan here.
#
# NEEDS BILINGUAL REVIEW (BENCHMARK_SPEC.md Section 7.4).
domain: finance

