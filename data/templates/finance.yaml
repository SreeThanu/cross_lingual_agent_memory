# Domain template: Financial & Administrative (BENCHMARK_SPEC.md Section 3, item 6).
# Format and placeholders: see data/templates/dining.yaml.
#
# Tests whether quantities and dates survive translation (BENCHMARK_SPEC.md §3).
# Numeric values always carry their unit ("5 तारीख", "1800 रुपये"), so a bare
# number never becomes a match target that an age or a time could also satisfy.
#
# Consistency with data/facts_v1.yaml: the user's bank (HDFC, f_007) and credit
# card network (Visa, f_016) exist. No value here contains "hdfc" or "visa".
# The son and daughter are children and have no finance facts. Rent is only for
# people without a home loan here.
#
# NEEDS BILINGUAL REVIEW (BENCHMARK_SPEC.md Section 7.4).
domain: finance

relations:
  rent_due_day:
    gender: {hi: m, hi-en: m}
    statement:
      en: "{Poss} rent is due on the {v} of every month."
      hi: "{poss} किराया हर महीने की {v} को देना होता है।"
      hi-en: "{Poss} rent har mahine ki {v} ko due hota hai."
    probe:
      en: "On which day of the month is {poss} rent due?"
      hi: "{poss} किराया महीने की किस तारीख को देना होता है?"
      hi-en: "{Poss} rent mahine ki kis tareekh ko due hota hai?"
    correction:
      en: "A correction: {poss} rent is not due on the {old}, it is due on the {new}."
      hi: "एक सुधार है: {poss} किराया {old} को नहीं, बल्कि {new} को देना होता है।"
      hi-en: "Ek correction hai: {poss} rent {old} ko nahi, {new} ko due hota hai."
    reprobe:
      en: "On which day of the month is {poss} rent due now?"
      hi: "अब {poss} किराया महीने की किस तारीख को देना होता है?"
    values:
      5th: {en: "5th", hi: "5 तारीख", hi-en: "5 tareekh"}
